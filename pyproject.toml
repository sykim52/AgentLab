[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-lab"
version = "0.1.0"
description = "Agent lab — apps/packages lifecycle for ontology and embedded diagnostic demos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-lab contributors" }]
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
langsmith = ["langsmith>=0.1.0"]
graph = ["neo4j>=5.0", "neo4j-graphrag>=1.0"]
train = ["torch", "transformers", "peft", "datasets", "accelerate"]

[project.scripts]
agent-lab-api = "agent_lab.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["apps/backend/src/agent_lab"]

[tool.hatch.build.targets.wheel.sources]
"apps/backend/src/agent_lab" = "agent_lab"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests"]
pythonpath = [
  "apps/backend/src",
  "packages/agent-core/src",
  "packages/ontology-rag/src",
  "packages/embedded-adas/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/backend/src", "packages", "apps/backend/tests", "pipelines", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
