# Mistral family — Stage-1 benchmark candidate
model:
  family: mistral
  model_id: mistralai/Mistral-7B-Instruct-v0.3
  revision: main
  purpose: [chat, tool, structured, diagnostic, graph_query]

benchmark:
  tasks: [structured_output, tool_calling, graph_query, log_diagnosis]
  metrics: [accuracy, latency_ms, vram_gb, tokens_per_sec]

finetuning:
  enabled: false
  method: qlora
  r: 16
  alpha: 32
  dropout: 0.05
