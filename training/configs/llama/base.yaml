# Llama family — base benchmark / later fine-tune (weights NOT in git)
model:
  family: llama
  model_id: meta-llama/Meta-Llama-3.1-8B-Instruct  # replace with accessible id
  revision: main
  purpose: [chat, tool, structured, diagnostic, graph_query]

benchmark:
  tasks: [structured_output, tool_calling, graph_query, log_diagnosis]
  metrics: [accuracy, latency_ms, vram_gb, tokens_per_sec]

finetuning:
  enabled: false  # set true only after Stage-1 selection
  method: qlora
  r: 16
  alpha: 32
  dropout: 0.05
